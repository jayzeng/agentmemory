name: Apply Codex Stop wiring

on:
  push:
    branches:
      - feat/codex-stop-capture

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Apply wiring patch
        run: node scripts/apply-codex-stop-wiring.mjs
      - name: Install dependencies
        run: npm ci
      - name: Format changed sources
        run: npx biome check --write src/cli.ts eval/capture-reliability.ts test/eval.test.ts test/codex-stop-hook.test.ts package.json
      - name: Validate patch
        run: |
          npm run lint
          npm run build
          npm run test:unit
          npm run test:cli
          npm run test:eval
          npm run test:token-savings
      - name: Commit validated patch and remove temporary patcher
        run: |
          git rm scripts/apply-codex-stop-wiring.mjs .github/workflows/apply-codex-stop-wiring.yml
          git add -A
          git config user.name "agentmemory-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: activate Codex Stop capture [codex-stop-wiring]"
          git push origin HEAD:feat/codex-stop-capture

name: Apply Qoder Stop capture

on:
  push:
    branches:
      - feat/qoder-stop-capture

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Apply Qoder slice
        run: python3 scripts/apply-qoder-stop-capture.py
      - name: Install dependencies
        run: npm ci
      - name: Format touched files
        run: npx biome check --write src/capture-check.ts src/hooks.ts src/cli.ts eval/capture-reliability.ts test/eval.test.ts test/qoder-stop-install.test.ts
      - name: Validate
        run: |
          npm run lint
          npm run build
          npm run test:unit
          npm run test:cli
          npm run test:eval
          npm run test:token-savings
          npm run test:harness
      - name: Commit validated slice
        run: |
          git rm scripts/apply-qoder-stop-capture.py .github/workflows/apply-qoder-stop-capture.yml
          git add -A
          git config user.name "agentmemory-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: mechanize Qoder Stop capture"
          git push origin HEAD:feat/qoder-stop-capture

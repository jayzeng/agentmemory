name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:public-boundary

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:cli
      - run: npm run test:eval

  windows-npm-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run test:cli
      - name: Pack, install, and execute npm Windows shim
        shell: pwsh
        run: |
          $packDir = Join-Path $env:RUNNER_TEMP "agentmemory-pack"
          $installDir = Join-Path $env:RUNNER_TEMP "agentmemory-install"
          New-Item -ItemType Directory -Force -Path $packDir, $installDir | Out-Null
          $tarball = (npm pack --pack-destination $packDir | Select-Object -Last 1).Trim()
          if (-not $tarball) { throw "npm pack did not produce a tarball" }
          npm install --prefix $installDir (Join-Path $packDir $tarball)
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          $wrapper = Join-Path $installDir "node_modules\.bin\agent-memory.cmd"
          if (-not (Test-Path $wrapper)) { throw "npm did not create agent-memory.cmd" }
          $expected = (node -p "require('./package.json').version").Trim()
          $actual = (& $wrapper version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "agent-memory.cmd version failed" }
          if ($actual -ne $expected) { throw "expected version $expected, got $actual" }

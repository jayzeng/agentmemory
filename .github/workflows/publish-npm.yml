name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@11.6.2
      - run: npm --version
      - run: npm ci
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "Publishing requires a v* tag ref; got $GITHUB_REF." >&2
              echo "For manual runs, dispatch the workflow from the release tag." >&2
              exit 1
              ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:cli
      - run: npm run test:eval
      - run: npm audit --audit-level=moderate
      - run: npm publish --access public

name: Refactor Codex Stop direct

on:
  push:
    branches:
      - feat/codex-stop-capture

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Rebuild hook installer from the #29 base and activate direct Codex Stop output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          BASE = "4338aef20e596a01d6fc0b115070fa0fe778bb17"
          subprocess.run(["git", "checkout", BASE, "--", "src/hooks.ts"], check=True)

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/hooks.ts",
              'function stopHookCommand(agent: "claude"): string {\n\treturn `agent-memory hook stop --agent ${agent}`;\n}',
              'function stopHookCommand(agent: "claude" | "codex"): string {\n\treturn `agent-memory hook stop --agent ${agent}`;\n}',
          )
          replace_once(
              "src/hooks.ts",
              '\t\t\tconst command = sessionStartHookCommand("codex");\n\t\t\treturn existing.includes(`command = "${command}"`);',
              '\t\t\tconst command = sessionStartHookCommand("codex");\n\t\t\treturn existing.includes(`command = "${command}"`) && isStopHookInstalled(homeDir, "codex");',
          )
          replace_once(
              "src/hooks.ts",
              '''/**
 * Read-only check whether the periodic Stop-hook memory-write nudge is present.
 * Claude Code only — Codex/Cursor/opencode don't have a confirmed equivalent
 * block/reason protocol for this event yet.
 */
export function isStopHookInstalled(homeDir: string, key: HookAgentKey): boolean {
\ttry {
\t\tif (key === "claude") return hasClaudeHookGroup(homeDir, "Stop", stopHookCommand("claude"));
\t} catch {}
\treturn false;
}''',
              '''/** Read-only check whether the Stop-hook memory-write capture check is present. */
export function isStopHookInstalled(homeDir: string, key: HookAgentKey): boolean {
\ttry {
\t\tif (key === "claude") return hasClaudeHookGroup(homeDir, "Stop", stopHookCommand("claude"));
\t\tif (key === "codex") {
\t\t\tconst configPath = path.join(homeDir, ".codex", "config.toml");
\t\t\tif (!fs.existsSync(configPath)) return false;
\t\t\tconst existing = fs.readFileSync(configPath, "utf-8");
\t\t\tif (!existing.includes(HOOK_MARKER_BEGIN)) return false;
\t\t\treturn existing.includes(`command = "${stopHookCommand("codex")}"`);
\t\t}
\t} catch {}
\treturn false;
}''',
          )
          replace_once(
              "src/hooks.ts",
              '\tconst sessionCommand = sessionStartHookCommand("codex");\n\tconst promptCommand = userPromptSubmitHookCommand("codex");',
              '\tconst sessionCommand = sessionStartHookCommand("codex");\n\tconst promptCommand = userPromptSubmitHookCommand("codex");\n\tconst stopCommand = stopHookCommand("codex");',
          )
          replace_once(
              "src/hooks.ts",
              '\tlines.push(HOOK_MARKER_END);',
              '''\tlines.push(
\t\t"",
\t\t"[[hooks.Stop]]",
\t\t"",
\t\t"[[hooks.Stop.hooks]]",
\t\t'type = "command"',
\t\t`command = "${stopCommand}"`,
\t\tHOOK_MARKER_END,
\t);''',
          )

          replace_once(
              "src/cli.ts",
              'async function cmdStop(_flags: Record<string, string | boolean>): Promise<void> {\n\tconst TIMEOUT_MS = 3_000;\n\tconst controller = new AbortController();',
              'async function cmdStop(flags: Record<string, string | boolean>): Promise<void> {\n\tconst TIMEOUT_MS = 3_000;\n\tconst controller = new AbortController();\n\tconst agent = getFlag(flags, "agent");',
          )
          replace_once(
              "src/cli.ts",
              '''\t\tif (shouldNagOnStop(sessionId, Date.now(), capture)) {
\t\t\tprocess.stdout.write(
\t\t\t\tJSON.stringify({
\t\t\t\t\thookSpecificOutput: { hookEventName: "Stop", additionalContext: STOP_NAG_REASON },
\t\t\t\t}),
\t\t\t);
\t\t}''',
              '''\t\tif (shouldNagOnStop(sessionId, Date.now(), capture)) {
\t\t\tconst response =
\t\t\t\tagent === "codex"
\t\t\t\t\t? { decision: "block", reason: STOP_NAG_REASON }
\t\t\t\t\t: { hookSpecificOutput: { hookEventName: "Stop", additionalContext: STOP_NAG_REASON } };
\t\t\tprocess.stdout.write(JSON.stringify(response));
\t\t}''',
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format touched files
        run: npx biome check --write src/hooks.ts src/cli.ts test/codex-stop-install.test.ts eval/capture-reliability.ts
      - name: Validate direct path
        run: |
          npm run lint
          npm run build
          npm run test:unit
          npm run test:cli
          npm run test:eval
          npm run test:token-savings
          npm run test:harness
      - name: Commit validated refactor and remove this temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/refactor-codex-stop-direct.yml
          git add -A
          git config user.name "agentmemory-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor: make Codex Stop protocol Core-native"
          git push origin HEAD:feat/codex-stop-capture
